name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-dev

      - name: Configure
        run: |
          cmake -S cpp-core -B cpp-core/build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build cpp-core/build --parallel

      - name: Test
        run: ctest --test-dir cpp-core/build --output-on-failure

  java:
    name: Java unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-backend/pom.xml

      - name: Run unit and controller tests
        run: mvn -B -f java-backend/pom.xml test

  attribution:
    name: Attribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject unauthorized AI attribution in new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            echo "No comparison base for this event; nothing new to scan."
            exit 0
          fi

          echo "Scanning commit messages in $range"
          git log --format=%B "$range" > /tmp/radixlab-commit-messages.txt

          if grep -Eiq '^[[:space:]]*co-authored-by:.*(claude|anthropic|deepseek|openai|gpt|copilot)' /tmp/radixlab-commit-messages.txt; then
            echo "Unauthorized AI co-author trailer found." >&2
            exit 1
          fi

          if grep -Eiq '(claude-session:|generated with claude code|built by claude|co-developed with claude|ai co-founder|claude developer)' /tmp/radixlab-commit-messages.txt; then
            echo "Unauthorized AI/tool attribution text found." >&2
            exit 1
          fi

          echo "Attribution policy check passed."

  end-to-end:
    name: End-to-end integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-dev

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-backend/pom.xml

      - name: Build and test C++ engine
        run: |
          cmake -S cpp-core -B cpp-core/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build cpp-core/build --parallel
          ctest --test-dir cpp-core/build --output-on-failure

      - name: Verify Java with the real C++ process
        env:
          RADIXLAB_CLI_PATH: ${{ github.workspace }}/cpp-core/build/radixlab-cli
        run: mvn -B -f java-backend/pom.xml verify
